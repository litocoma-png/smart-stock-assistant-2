name: Build Smart Stock Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v6
      - name: Bundle the current store app into the Android app
        run: |
          mkdir -p android-app/app/src/main/assets
          mkdir -p android-app/app/src/main/res/drawable-nodpi
          cp index.html android-app/app/src/main/assets/index.html
          cp smart-stock-logo.png manifest.webmanifest service-worker.js icon-180.png icon-192.png icon-512.png android-app/app/src/main/assets/
          cp icon-512.png android-app/app/src/main/res/drawable-nodpi/app_icon.png
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Build installable APK
        working-directory: android-app
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-stock-android-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/app/build/outputs/apk/debug/app-debug.apk
          name: Smart Stock Assistant ${{ github.ref_name }}
          generate_release_notes: true
